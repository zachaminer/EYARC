<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Example Project</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    max-width: 700px;
    margin: 60px auto;
    padding: 0 20px;
    color: #1a1a1a;
    text-align: center;
  }
  button {
    font-size: 1rem;
    padding: 10px 20px;
    border-radius: 6px;
    border: none;
    background: #2054c9;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #163e99; }
  #count { font-size: 2rem; margin: 20px 0; }
</style>
</head>
<body>

  <h1>Example Project</h1>
  <p>This is a plain HTML/CSS/JavaScript page — no build tools, no npm, nothing
     to install. Just copy this file, rename it, and edit the content.</p>

  <div id="count">0</div>
  <button onclick="increment()">Click me</button>

  <script>
    let count = 0;
    function increment() {
      count++;
      document.getElementById('count').textContent = count;
    }
  </script>

</body>
</html>
