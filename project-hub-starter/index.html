<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Project Hub</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    max-width: 700px;
    margin: 60px auto;
    padding: 0 20px;
    color: #1a1a1a;
    background: #fafafa;
  }
  h1 { font-size: 1.8rem; margin-bottom: 0.2em; }
  p.sub { color: #666; margin-top: 0; }
  ul { list-style: none; padding: 0; }
  li {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  li a {
    display: block;
    padding: 14px 18px;
    text-decoration: none;
    color: #2054c9;
    font-weight: 600;
  }
  li a:hover { background: #f0f4ff; }

    margin-top: 40px;
    font-size: 0.85rem;
    color: #999;
  }
</style>

<body>
  <h1>Project Hub</h1>
  <p class="sub">Every page below lives as one file in the <code>projects/</code> folder.</p>

  <ul id="project-list">
    <!-- Add a new <li><a href="projects/yourfile.html">Display Name</a></li> line
         every time you add a new project file. This list is manual on purpose
         so it works with zero setup — see README.md for an auto-generating
         option if the list grows large. -->
    <li><a href="projects/example.html">Example Project</a></li>
  </ul>

  <p class="note">To add a new page: create a file in <code>projects/</code>, then add a line to this list linking to it.</p>
